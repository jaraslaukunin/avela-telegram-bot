<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f0" />
    <link rel="icon" href="/logo.svg?v=1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.svg?v=1" />
    <title>Avela — запись к врачу</title>
    <!-- SDK Telegram: обязателен, иначе window.Telegram.WebApp и initData пустые -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Тёмная тема ДО первой отрисовки: без этого экран мигнёт светлым.
      (function () {
        try {
          var webApp = window.Telegram && window.Telegram.WebApp;
          var scheme = webApp && webApp.colorScheme ? webApp.colorScheme : null;
          if (!scheme && window.matchMedia) {
            scheme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (scheme) {
            document.documentElement.dataset.theme = scheme;
          }
        } catch (error) {
          /* окно без matchMedia/Telegram — остаёмся на светлой теме */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
