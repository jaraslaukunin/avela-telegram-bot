services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avela
      POSTGRES_PASSWORD: avela
      POSTGRES_DB: avela
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./supabase/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avela"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
