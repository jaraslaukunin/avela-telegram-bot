# Avela: TLS-терминация и маршрутизация доменов на VPS.
#
# Сертификаты: Cloudflare Origin CA (или Let's Encrypt) в ./deploy/certs/.
# Ожидаемые файлы:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# Cloudflare: SSL/TLS → Full (strict), проксирование включено.

server {
    listen 80;
    server_name avela.jaraslau.dev api.avela.jaraslau.dev bot.avela.jaraslau.dev status.avela.jaraslau.dev
                staging.avela.jaraslau.dev api.staging.avela.jaraslau.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Mini App (production) ---
server {
    listen 443 ssl;
    http2 on;
    server_name avela.jaraslau.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API (production) ---
server {
    listen 443 ssl;
    http2 on;
    server_name api.avela.jaraslau.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --- Telegram webhook ---
server {
    listen 443 ssl;
    http2 on;
    server_name bot.avela.jaraslau.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location /telegram/webhook {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }
}

# --- Status page ---
server {
    listen 443 ssl;
    http2 on;
    server_name status.avela.jaraslau.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /var/www/status;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Staging ---
server {
    listen 443 ssl;
    http2 on;
    server_name staging.avela.jaraslau.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.staging.avela.jaraslau.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
