# Avela: один домен, TLS-терминация и маршрутизация на VPS.
#
#   https://avela.jaraslau.dev/            — Mini App (статика)
#   https://avela.jaraslau.dev/api/*       — FastAPI (префикс /api срезается)
#   https://avela.jaraslau.dev/api/telegram/webhook — Telegram webhook
#   https://avela.jaraslau.dev/status/     — status page
#
# Схема «одного origin» выбрана осознанно: браузер внутри Telegram ходит на
# тот же домен, что и Mini App, поэтому CORS не нужен вовсе, а сертификат
# и DNS-запись нужны только для одного имени.
#
# Сертификаты: Cloudflare Origin CA (или Let's Encrypt) в ./deploy/certs/:
#   /etc/nginx/certs/fullchain.pem
#   /etc/nginx/certs/privkey.pem
# Cloudflare: SSL/TLS → Full (strict), запись avela.jaraslau.dev — Proxied.

server {
    listen 80;
    server_name avela.jaraslau.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name avela.jaraslau.dev;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Фото врачей и загрузки — с запасом, но без фанатизма.
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # --- API под /api/ (префикс срезается: /api/health → /health) ---
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Status page ---
    location = /status {
        return 301 /status/;
    }

    location /status/ {
        alias /var/www/status/;
        index index.html;
    }

    # --- Mini App (SPA) ---
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
